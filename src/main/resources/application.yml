spring:
  application:
    name: jobify
  profiles:
    default: test
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: 8090

email:
  email-enabled: true

logging:
  level:
    root: INFO
    com.jobify: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.mail: WARN
